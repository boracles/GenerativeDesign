<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>3‑D Simplex Noise</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000
        }
    </style>
</head>

<body>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

        /* 1. 기본 셋업 --------------------------------------------------- */
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 200);
        camera.position.set(0, 45, 60);
        camera.lookAt(0, -20, 0);

        /* 2. 3‑D Simplex 셰이더 ----------------------------------------- */
        const shaderMat = new THREE.ShaderMaterial({
            uniforms: { uTime: { value: 0 }, uFreq: { value: 0.08 }, uAmp: { value: 8 } },
            side: THREE.DoubleSide,
            vertexShader:/* glsl */`
precision highp float;
uniform float uTime,uFreq,uAmp;
varying float vHeight;
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289((x*34.+1.)*x);}
/* -------- 3‑D Simplex noise 함수 (전체) -------- */
float snoise(vec3 v){
  const vec2 C = vec2(1./6.,1./3.);
  const vec4 D = vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g = step(x0.yzx,x0.xyz);
  vec3 l = 1.-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i = mod289(i);
  vec4 p = permute( permute( permute(
            i.z + vec4(0., i1.z, i2.z, 1.))
          + i.y + vec4(0., i1.y, i2.y, 1.))
          + i.x + vec4(0., i1.x, i2.x, 1.));
  vec4 j  = p - 49.*floor(p*0.0243902439);
  vec4 x_ = floor(j*0.142857142857)*0.142857142857+0.0714285714286;
  vec4 y_ = floor(j-7.*floor(j*0.142857142857))*0.142857142857+0.0714285714286;
  vec4 x = x_*2.-1., y = y_*2.-1.;
  vec4 h = 1.-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy), b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.+1., s1=floor(b1)*2.+1.;
  vec4 sh=-step(h,vec4(0.));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 g0=vec3(a0.xy ,h.x), g1=vec3(a0.zw,h.y),
       g2=vec3(a1.xy ,h.z), g3=vec3(a1.zw,h.w);
  vec4 norm=inversesqrt(vec4(dot(g0,g0),dot(g1,g1),
                             dot(g2,g2),dot(g3,g3)));
  g0*=norm.x; g1*=norm.y; g2*=norm.z; g3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),
                      dot(x2,x2),dot(x3,x3)),0.); m*=m;
  return 42.*dot(m*m,vec4(dot(g0,x0),dot(g1,x1),
                          dot(g2,x2),dot(g3,x3)));
}
void main(){
  vec3 p = position;                       // XZ 평면
  float h = snoise(vec3(p.xz*uFreq,uTime))*uAmp;
  p.y += h;                                // Y축 = 높이
  vHeight = h;
  gl_Position = projectionMatrix*modelViewMatrix*vec4(p,1.);
}`,
            fragmentShader:/* glsl */`
precision mediump float;
varying float vHeight;
void main(){
  float c = smoothstep(-4.,8.,vHeight);
  gl_FragColor = vec4(vec3(c),1.);
}`
        });

        /* 3. 메쉬 생성 ---------------------------------------------------- */
        const geom = new THREE.PlaneGeometry(80, 80, 256, 256);
        geom.rotateX(-Math.PI / 2);                         // 버텍스 자체를 눕힘
        const plane = new THREE.Mesh(geom, shaderMat);     // ★ plane 생성
        scene.add(plane);

        /* 4. 애니메이션 --------------------------------------------------- */
        const clock = new THREE.Clock();
        function animate() {
            shaderMat.uniforms.uTime.value += clock.getDelta();
            plane.rotation.y += 0.0015;                     // Y축 회전
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        animate();

        /* 5. 리사이즈 ----------------------------------------------------- */
        addEventListener('resize', () => {
            renderer.setSize(innerWidth, innerHeight);
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
        });
    </script>
</body>

</html>
