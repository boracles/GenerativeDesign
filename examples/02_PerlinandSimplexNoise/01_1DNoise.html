<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <title>1-D Simplex Noise (Three.js)</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #fff
    }
  </style>
</head>

<body>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';
    import { SimplexNoise } from 'https://unpkg.com/three@0.165.0/examples/jsm/math/SimplexNoise.js';

    /* 기본 세팅 */
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setClearColor(0xffffff, 1);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(
      innerWidth / -2, innerWidth / 2, innerHeight / 2, innerHeight / -2, 0.1, 10);
    camera.position.z = 5;

    /* 1-D Noise 함수 */
    const simplex = new SimplexNoise();   // seed 없이 생성
    const scale = 0.008;                // 주파수
    function noise1d(x, t = 0) {
      return simplex.noise(x * scale, t); // -1 ~ 1
    }

    /* 라인 지오메트리 */
    const NUM = 1024;
    const verts = new Float32Array(NUM * 3);
    const geom = new THREE.BufferGeometry();
    geom.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    const line = new THREE.Line(geom,
      new THREE.LineBasicMaterial({ color: 0x000000 }));
    scene.add(line);

    /* 애니메이션 */
    let t = 0;
    function animate() {
      t += 0.002; // 매 프레임마다 증가
      for (let i = 0; i < NUM; i++) {
        const x = (i / (NUM - 1) - 0.5) * innerWidth; // 화면 가로
        const y = noise1d(i, t) * 200;                // 진폭
        verts[i * 3] = x;
        verts[i * 3 + 1] = y;
        verts[i * 3 + 2] = 0;
      }
      geom.attributes.position.needsUpdate = true;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    /* 리사이즈 */
    addEventListener('resize', () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.left = innerWidth / -2;
      camera.right = innerWidth / 2;
      camera.top = innerHeight / 2;
      camera.bottom = innerHeight / -2;
      camera.updateProjectionMatrix();
    });
  </script>
</body>

</html>
