<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <title>2D → 3D Simplex Noise Demo (Fixed)</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #000
        }
    </style>
</head>

<body>
    <script type="module">
        /***** 0. 의존 라이브러리 *****/
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { SimplexNoise } from 'https://unpkg.com/three@0.160.0/examples/jsm/math/SimplexNoise.js';

        /***** 1. 공통 세팅 *****/
        const SIZE = 256;   // 노이즈 해상도 (텍스처 & 지형 세그먼트)
        const SCALE = 0.06;  // 노이즈 주파수
        const HEIGHT_MUL = 20;    // 지형 높이 배수

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
        camera.position.set(0, 120, 180);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        document.body.appendChild(renderer.domElement);

        /***** 2. Simplex 노이즈 → RGBA 텍스처 *****/
        const simplex = new SimplexNoise();
        const rgba = new Uint8Array(SIZE * SIZE * 4);

        for (let y = 0; y < SIZE; y++) {
            for (let x = 0; x < SIZE; x++) {
                const i = y * SIZE + x;
                const v = simplex.noise(x * SCALE, y * SCALE, 0);      // -1~1
                const g = (v * 0.5 + 0.5) * 255;                     // 0~255 회색값
                const j = i * 4;
                rgba[j] = rgba[j + 1] = rgba[j + 2] = g;   // R=G=B
                rgba[j + 3] = 255;                       // 알파 100%
            }
        }
        const texture = new THREE.DataTexture(rgba, SIZE, SIZE, THREE.RGBAFormat);
        texture.needsUpdate = true;

        /***** 3. 2D 평면 뷰 *****/
        const planeGeo = new THREE.PlaneGeometry(200, 200);
        planeGeo.rotateX(-Math.PI / 2);
        const planeMat = new THREE.MeshBasicMaterial({ map: texture });
        const plane = new THREE.Mesh(planeGeo, planeMat);
        scene.add(plane);

        /***** 4. 3D 지형 메시 *****/
        const terrainGeo = new THREE.PlaneGeometry(200, 200, SIZE - 1, SIZE - 1);
        terrainGeo.rotateX(-Math.PI / 2);
        const colors = new Float32Array(SIZE * SIZE * 3);
        terrainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const terrainMat = new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: false });
        const terrain = new THREE.Mesh(terrainGeo, terrainMat);
        terrain.visible = false;
        scene.add(terrain);

        /***** 5. 노이즈 값으로 높이 & 컬러 *****/
        function buildTerrain() {
            const pos = terrainGeo.attributes.position;
            const col = terrainGeo.attributes.color;
            for (let y = 0; y < SIZE; y++) {
                for (let x = 0; x < SIZE; x++) {
                    const i = y * SIZE + x;
                    const g = rgba[i * 4] / 255;   // R값 == 회색값 (0~1)
                    const h = g * HEIGHT_MUL;
                    pos.setY(i, h);
                    // 팔레트: 갈색→초록→회색
                    let r, gc, b;
                    if (g < 0.3) { r = 0.46; gc = 0.32; b = 0.17; }
                    else if (g < 0.6) { r = 0.1 + g * 0.2; gc = 0.4 + g * 0.4; b = 0.1; }
                    else { r = gc = b = 0.5 + g * 0.3; }
                    col.setXYZ(i, r, gc, b);
                }
            }
            pos.needsUpdate = col.needsUpdate = true;
            terrainGeo.computeVertexNormals();
        }

        /***** 6. 조명 *****/
        const dir = new THREE.DirectionalLight(0xffffff, 1);
        dir.position.set(30, 60, 40);
        scene.add(dir);

        /***** 7. 반응형 *****/
        addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });

        /***** 8. T → 2D/3D 토글 *****/
        let isTerrain = false;
        addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 't') {
                isTerrain = !isTerrain;
                plane.visible = !isTerrain;
                terrain.visible = isTerrain;
                if (isTerrain) buildTerrain();
            }
        });

        /***** 9. 렌더 루프 *****/
        (function animate() {
            requestAnimationFrame(animate);
            if (isTerrain) terrain.rotation.y += 0.0009;
            renderer.render(scene, camera);
        })();
    </script>
</body>

</html>
